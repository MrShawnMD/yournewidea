<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your New Idea — Websites Built Live, Ready To Buy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F2; --ink:#10261C; --ink2:#34433c; --mute:#6b7a72; --line:#dfe4e1;
  --accent:#16A34A; --accent2:#dcf5e5; --live:#E5283A; --card:#fff;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- top nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .bulb{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.logo span em{font-style:normal;color:var(--accent)}
.nav nav{display:flex;gap:22px;margin-left:auto;font-weight:500;font-size:15px}
.nav nav a{opacity:.75}.nav nav a:hover,.nav nav a.on{opacity:1}
.nav nav a.on{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.pill-live{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;padding:9px 15px;border-radius:99px;font-weight:600;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(229,40,58,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,40,58,.6)}70%{box-shadow:0 0 0 9px rgba(229,40,58,0)}100%{box-shadow:0 0 0 0 rgba(229,40,58,0)}}
.burger{display:none;margin-left:auto;font-size:26px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 6px 0 #0f7a36}
.btn-accent:hover{box-shadow:0 8px 0 #0f7a36}
.btn-ghost{border:1.5px solid var(--ink);background:#fff}
.btn-sm{padding:9px 14px;font-size:14px;border-radius:10px}

/* ---------- hero ---------- */
.hero{padding:80px 0 60px;position:relative;overflow:hidden;background:radial-gradient(900px 420px at 85% 10%,#dcf5e5,transparent 70%),#fff;border-bottom:1px solid var(--line)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,7.2vw,96px);line-height:.95;letter-spacing:-.035em;margin:18px 0 22px;max-width:960px}
.hero h1 .scribble{position:relative;white-space:nowrap}
.hero h1 .scribble svg{position:absolute;left:-2%;bottom:-6px;width:104%;height:22px}
.hero p.lead{font-size:20px;color:var(--ink2);max-width:620px;margin-bottom:32px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.steps-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:64px;border:1.5px solid var(--line);box-shadow:0 10px 30px -18px rgba(16,38,28,.25);border-radius:18px;overflow:hidden;background:#fff}
.steps-row div{padding:22px 22px 24px;border-right:1.5px solid var(--line)}
.steps-row div:last-child{border-right:0}
.steps-row b{font-family:var(--display);font-size:40px;line-height:1;color:var(--accent);display:block;margin-bottom:8px}
.steps-row h4{font-family:var(--display);font-size:19px;margin-bottom:4px}
.steps-row p{font-size:14px;color:var(--mute)}

/* ---------- sections ---------- */
section.block{padding:70px 0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.sec-head h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.4vw,54px);letter-spacing:-.03em;line-height:1}
.sec-head p{color:var(--mute);max-width:440px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.filters button{padding:8px 15px;border-radius:99px;border:1.5px solid var(--line);font-size:14px;font-weight:500;background:#fff}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* project grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.pcard{background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(0,0,0,.25)}
.pcard .thumb{height:210px;position:relative;overflow:hidden}
.pcard .thumb .mini{position:absolute;inset:16px 16px 0;border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#fff;letter-spacing:.02em}
.pcard .thumb img.shot{position:absolute;inset:16px 16px 0;width:calc(100% - 32px);height:calc(100% - 16px);object-fit:cover;object-position:top;border-radius:10px 10px 0 0;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);transition:transform .4s}
.pcard:hover .thumb img.shot{transform:scale(1.03)}
.browser .viewport.scroll{overflow-y:auto;cursor:auto}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
.showcase{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.showcase a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 14px 30px -18px rgba(16,38,28,.35);transition:transform .25s}
.showcase a:hover{transform:translateY(-6px) rotate(-.6deg)}
.showcase .bar{height:18px;background:#eef1ef;display:flex;gap:4px;align-items:center;padding:0 8px}
.showcase .bar i{width:6px;height:6px;border-radius:50%;background:#c9d1cd}
.showcase img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block}
.showcase span{display:block;font-size:13px;font-weight:600;padding:8px 10px}
.pcard .tag{position:absolute;top:14px;left:14px;z-index:2;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#fff;letter-spacing:.02em}
.tag.sale{background:#1f9d55;color:#fff}.tag.client{background:#2b59c3;color:#fff}.tag.brand{background:var(--ink);color:#fff}
.pcard .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.livebadge{color:var(--accent);font-weight:700}
.pcard .dom{font-size:13px;color:var(--mute);font-weight:500}
.pcard h3{font-family:var(--display);font-size:25px;letter-spacing:-.02em;line-height:1.05}
.pcard p{font-size:15px;color:var(--ink2);flex:1}
.pcard .row{display:flex;gap:8px;margin-top:10px}

/* live */
.live-band{background:var(--ink);color:#fff;border-radius:28px;padding:54px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.live-band h2{font-family:var(--display);font-size:clamp(34px,4.4vw,56px);line-height:1;letter-spacing:-.03em;margin:14px 0 16px}
.live-band p{color:#b7c9bf;font-size:17px;margin-bottom:24px}
.screen{aspect-ratio:16/10;background:#0a1a13;border-radius:18px;position:relative;overflow:hidden;border:1px solid #23443a}
.screen .bar{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:2}
.screen .bar span{background:var(--live);font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px}
.screen .bar span.v{background:rgba(255,255,255,.15)}
.typing{position:absolute;inset:56px 22px 22px;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#9ef0b6;line-height:1.7;white-space:pre-wrap}
.chat{position:absolute;right:14px;bottom:14px;width:46%;display:flex;flex-direction:column;gap:6px}
.chat div{background:rgba(255,255,255,.1);font-size:12px;padding:6px 10px;border-radius:10px;color:#eee;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* detail page */
.detail-hero{padding:46px 0 30px}
.crumb{font-size:14px;color:var(--mute);margin-bottom:20px}
.crumb a{text-decoration:underline}
.dgrid{display:grid;grid-template-columns:1.35fr .65fr;gap:34px;align-items:start}
.browser{border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:#fff;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.browser .chrome{height:40px;background:#e8ecea;border-bottom:1.5px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 14px}
.browser .chrome i{width:11px;height:11px;border-radius:50%;background:#c9d1cd;display:block}
.browser .chrome .url{margin-left:14px;background:#fff;border-radius:7px;padding:4px 12px;font-size:12.5px;color:var(--ink2);flex:1;max-width:360px;border:1px solid var(--line)}
.browser .viewport{height:430px;overflow:hidden;position:relative}
.browser .viewport .mini{position:absolute;inset:0}
.browser .overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 55%);opacity:0;transition:.2s}
.browser:hover .overlay{opacity:1}
.side{background:#fff;border-radius:20px;border:1px solid var(--line);padding:26px;position:sticky;top:90px}
.side h1{font-family:var(--display);font-size:38px;line-height:1;letter-spacing:-.03em;margin:10px 0 6px}
.side .dom{color:var(--mute);font-weight:500;margin-bottom:16px}
.side .price{font-family:var(--display);font-size:22px;margin:6px 0 4px}
.side .note{font-size:13px;color:var(--mute);margin-bottom:18px}
.side .btns{display:flex;flex-direction:column;gap:10px}
.side .btns .btn{justify-content:center}
.inc{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.inc h5{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:10px}
.inc li{list-style:none;padding:6px 0 6px 26px;position:relative;font-size:15px}
.inc li:before{content:"";position:absolute;left:0;top:10px;width:16px;height:16px;border-radius:50%;background:var(--accent2);box-shadow:inset 0 0 0 5px var(--accent)}
.about{margin-top:44px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.about h3{font-family:var(--display);font-size:26px;letter-spacing:-.02em;margin-bottom:10px}
.about p,.about li{color:var(--ink2);font-size:16px}
.about ul{padding-left:18px}.about li{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips span{font-size:13px;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--line)}

/* how it works */
.hiw{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.hiw .c{background:#fff;border-radius:20px;padding:28px;border:1px solid var(--line)}
.hiw .n{font-family:var(--display);font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.hiw h3{font-family:var(--display);font-size:24px;margin:10px 0 8px}
.hiw p{color:var(--ink2)}
.faq{margin-top:40px;max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{font-family:var(--display);font-size:20px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.faq summary:after{content:"+";color:var(--accent)}
.faq details[open] summary:after{content:"–"}
.faq p{margin-top:10px;color:var(--ink2)}

/* footer */
footer{border-top:1px solid var(--line);padding:40px 0 60px;margin-top:40px;background:#fff;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;place-items:center;z-index:200;padding:20px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:22px;max-width:520px;width:100%;padding:30px;position:relative;max-height:90vh;overflow:auto}
.modal h3{font-family:var(--display);font-size:28px;letter-spacing:-.02em;margin-bottom:4px}
.modal .x{position:absolute;right:18px;top:14px;font-size:26px;color:var(--mute)}
.modal label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.modal input,.modal select,.modal textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--ink)}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .ok{text-align:center;padding:20px 0}
.modal .ok .big{font-size:48px}

/* ---------- demo shell ---------- */
.demo-bar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;font-size:14px}
.demo-bar a.back{opacity:.8}.demo-bar a.back:hover{opacity:1}
.demo-bar .t{margin:0 auto;opacity:.85}
.demo-bar .t b{color:#fff}
.demo-stage{min-height:calc(100vh - 50px);display:flex;flex-direction:column}.demo-stage>.ds{flex:1}
.demo-flag{position:fixed;left:16px;bottom:16px;z-index:61;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:7px 12px;border-radius:99px}

/* generic demo site bits */
.ds{font-family:var(--body);min-height:100%}
.ds .dnav{display:flex;align-items:center;gap:22px;padding:18px 34px}
.ds .dnav .brand{font-weight:800;font-size:22px;margin-right:auto}
.ds .dnav a{cursor:pointer;font-size:14px;font-weight:600;opacity:.8}
.ds .dnav a.on,.ds .dnav a:hover{opacity:1}
.ds .dhero{padding:70px 34px}
.ds .dsec{padding:44px 34px}
.ds .dgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.ds .dbtn{display:inline-block;padding:13px 22px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
.ds .item{border-radius:12px;padding:16px;cursor:pointer;transition:transform .15s}
.ds .item:hover{transform:translateY(-3px)}
.ds .item h4{margin:10px 0 4px;font-size:16px}
.ds .small{font-size:13px;opacity:.7}
.ds input,.ds select{padding:12px 14px;border-radius:8px;border:1px solid #ccc;font:inherit;width:100%}
.ds .toast{position:fixed;right:20px;bottom:20px;padding:14px 18px;border-radius:10px;font-weight:600;z-index:70;animation:rise .3s}

@media (max-width:900px){
  .nav nav{display:none}.burger{display:block}
  .nav nav.open{display:flex;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--paper);padding:20px 24px;border-bottom:1px solid var(--line)}
  .nav .pill-live{display:none}
  .steps-row{grid-template-columns:1fr 1fr}.steps-row div:nth-child(2){border-right:0}.steps-row div:nth-child(-n+2){border-bottom:1.5px solid var(--line)}
  .live-band{grid-template-columns:1fr;padding:30px}
  .dgrid,.about,.hiw{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:1fr}
  .showcase{grid-template-columns:1fr 1fr}
  .hero h1 .scribble{white-space:normal}.hero h1 .scribble svg{display:none}.hero h1 .scribble{color:var(--accent)}
  .ds .dnav{flex-wrap:wrap;padding:14px 18px;gap:14px}.ds .dhero,.ds .dsec{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>
<div id="app"></div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
/* ============ ART HELPERS (all drawn, no outside images) ============ */
function wheelSVG(spokes=5,rim='#c9ccd1',face='#2a2d33',cap='#e11d2e',size=120,style='split'){
  let s='';
  for(let i=0;i<spokes;i++){
    const a=i*360/spokes;
    if(style==='split'){
      s+=`<g transform="rotate(${a} 60 60)"><path d="M56 60 L53 18 L58 17 L60 60Z" fill="${rim}"/><path d="M64 60 L67 18 L62 17 L60 60Z" fill="${rim}"/></g>`;
    }else if(style==='mesh'){
      s+=`<g transform="rotate(${a} 60 60)"><path d="M60 60 L48 17 L54 16Z" fill="${rim}"/><path d="M60 60 L72 17 L66 16Z" fill="${rim}"/></g>`;
    }else{
      s+=`<g transform="rotate(${a} 60 60)"><path d="M52 58 Q56 30 54 17 L66 17 Q64 30 68 58Z" fill="${rim}"/></g>`;
    }
  }
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}"><circle cx="60" cy="60" r="58" fill="#111"/><circle cx="60" cy="60" r="47" fill="${face}"/><circle cx="60" cy="60" r="46" fill="none" stroke="${rim}" stroke-width="3"/>${s}<circle cx="60" cy="60" r="12" fill="${rim}"/><circle cx="60" cy="60" r="6" fill="${cap}"/></svg>`;
}
function bottleSVG(glass='#7a3e12',label='#f1e3c4',cap='#1a1a1a',w=60){
  return `<svg viewBox="0 0 60 150" width="${w}" height="${w*2.5}"><rect x="23" y="2" width="14" height="16" rx="2" fill="${cap}"/><path d="M24 18 h12 v22 q16 10 16 30 v70 q0 8 -8 8 h-28 q-8 0 -8 -8 v-70 q0 -20 16 -30z" fill="${glass}"/><rect x="11" y="78" width="38" height="40" rx="3" fill="${label}"/><rect x="17" y="88" width="26" height="3" fill="${glass}" opacity=".7"/><rect x="20" y="96" width="20" height="2" fill="${glass}" opacity=".5"/><path d="M28 30 v100" stroke="#fff" stroke-opacity=".18" stroke-width="3"/></svg>`;
}
function boxSVG(c1='#0b2a5b',c2='#c8102e',txt='HOBBY'){
  return `<svg viewBox="0 0 120 90" width="100%" height="110"><path d="M20 22 L70 10 L104 24 L54 38Z" fill="${c2}"/><path d="M20 22 L54 38 L54 82 L20 66Z" fill="${c1}"/><path d="M54 38 L104 24 L104 68 L54 82Z" fill="${c1}" opacity=".85"/><text x="62" y="58" fill="#fff" font-size="9" font-weight="700" font-family="Oswald,sans-serif" transform="skewY(-15) translate(0,16)">${txt}</text><path d="M24 34 L50 46" stroke="#fff" stroke-opacity=".35" stroke-width="2"/></svg>`;
}
function gadgetSVG(kind,c){
  const m={
    projector:`<circle cx="60" cy="62" r="34" fill="${c}"/><circle cx="60" cy="62" r="20" fill="#1b1340"/>${[...Array(9)].map((_,i)=>`<circle cx="${40+Math.sin(i*1.7)*18+18}" cy="${46+Math.cos(i*2.3)*14+14}" r="1.8" fill="#fff"/>`).join('')}<rect x="38" y="94" width="44" height="8" rx="4" fill="#333"/>`,
    lamp:`<path d="M40 30 h40 l10 34 h-60z" fill="${c}"/><rect x="57" y="64" width="6" height="28" fill="#555"/><ellipse cx="60" cy="96" rx="22" ry="6" fill="#333"/>`,
    bottle:`<rect x="45" y="22" width="30" height="78" rx="12" fill="${c}"/><rect x="50" y="14" width="20" height="12" rx="4" fill="#333"/><rect x="45" y="52" width="30" height="16" fill="#fff" opacity=".5"/>`,
    fan:`<circle cx="60" cy="54" r="30" fill="none" stroke="${c}" stroke-width="6"/>${[0,120,240].map(a=>`<ellipse cx="60" cy="38" rx="7" ry="15" fill="${c}" transform="rotate(${a} 60 54)"/>`).join('')}<rect x="56" y="84" width="8" height="14" fill="#555"/><rect x="44" y="98" width="32" height="6" rx="3" fill="#333"/>`,
    ring:`<circle cx="60" cy="60" r="32" fill="none" stroke="${c}" stroke-width="10"/><circle cx="60" cy="60" r="32" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 6" opacity=".7"/>`,
    pet:`<ellipse cx="60" cy="70" rx="34" ry="24" fill="${c}"/><circle cx="46" cy="64" r="5" fill="#fff"/><circle cx="74" cy="64" r="5" fill="#fff"/><circle cx="46" cy="64" r="2.5" fill="#222"/><circle cx="74" cy="64" r="2.5" fill="#222"/><path d="M34 52 l6 -16 l10 12z M86 52 l-6 -16 l-10 12z" fill="${c}"/>`
  };
  return `<svg viewBox="0 0 120 120" width="100%" height="130">${m[kind]}</svg>`;
}
function golfSVG(c='#1f7a4c'){return `<svg viewBox="0 0 60 60" width="44" height="44"><circle cx="30" cy="30" r="28" fill="${c}"/><path d="M24 14 v32" stroke="#fff" stroke-width="2.5"/><path d="M24 14 l14 6 l-14 6z" fill="#ffd54a"/><ellipse cx="30" cy="46" rx="12" ry="3" fill="#fff" opacity=".5"/></svg>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  return `<div class="filters">${cats.map(c=>`<button class="${c===filter?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join('')}</div><div class="grid" id="grid">${list.map(card).join('')}</div>`;
}

function pgBook(){const k=(D['pure-green']||{}).pick;toast(k?'Estimate booked for '+k+' — we\'ll text to confirm':'Pick a day and time first','#15803d','#fff')}
function renderDemo(slug){
 const p=P.find(x=>x.slug===slug);const s=D[slug]=D[slug]||{};
 const cta=p.status==='sale'?`<button class="btn btn-accent btn-sm" onclick="openOffer('${slug}')">Make An Offer</button>`:p.status==='client'?`<button class="btn btn-accent btn-sm" onclick="openOffer('${slug}','revamp')">Get One Like This</button>`:`<button class="btn btn-accent btn-sm" onclick="openOffer('${slug}','similar')">Build Me One</button>`;
 document.getElementById('app').innerHTML=`<div class="demo-bar"><a class="back" href="#${slug}">← Back</a><div class="t">Clicking through <b>${p.domain}</b></div>${(p.live||p.design)?`<a class="btn btn-sm" style="border:1.5px solid #3b5a4c;color:#fff" href="${p.live||p.design}" target="_blank" rel="noopener">${p.live?'Live Site':'Full Design'} ↗</a>`:''}${cta}</div><div class="demo-stage" style="position:relative">${DEMOS[slug](s)}</div><div class="demo-flag">Demo preview · yournewidea.com</div>`;
}

/* ============ ROUTER ============ */
let timers=[];
function route(){
 timers.forEach(clearInterval);timers=[];closeModal();
 const h=(location.hash||'#home').slice(1);
 const app=document.getElementById('app');
 if(h.endsWith('-demo')){const slug=h.slice(0,-5);if(DEMOS[slug]){D[slug]={};renderDemo(slug);window.scrollTo(0,0);return}}
 const p=P.find(x=>x.slug===h);
 app.innerHTML = p?pageDetail(p): h==='marketplace'?pageMarket(): h==='live'?pageLive(): h==='how-it-works'?pageHIW(): h==='sell'?pageSell(): pageHome();
 window.scrollTo(0,0);
 startLive();
}
function startLive(){
 const el=document.getElementById('typing');if(!el)return;
 const lines=['> idea: "bid-your-price tee times"','> checking domains...  ✓ available','> buying domain...  ✓ done','> building homepage...','  ✓ hero  ✓ how it works  ✓ listings','> setting up checkout...  ✓','> site is live 🚀'];
 const chat=['make it green!','add phone alerts 🔥','I want to buy this','what about restaurants?','🔥🔥🔥'];
 let i=0,c=0,txt='';
 timers.push(setInterval(()=>{const L=lines[i%lines.length];if(c<L.length){txt+=L[c++];}else{txt+='\n';i++;c=0;if(i%lines.length===0)txt='';}el.textContent=txt+'▌'},45));
 const ch=document.getElementById('chat');let k=0;
 timers.push(setInterval(()=>{const d=document.createElement('div');d.textContent=chat[k++%chat.length];ch.appendChild(d);if(ch.children.length>3)ch.firstChild.remove()},1800));
}
window.addEventListener('hashchange',route);route();
</script>
