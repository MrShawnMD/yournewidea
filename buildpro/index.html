<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuildPro HD Working Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed role bar, then one working surface per role. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#141a22; --soft:#56616f; --line:#dde2e9;
  --accent:#17458f; --good:#1d6b45; --warn:#8a5a00; --bad:#9c2a2a;
  --goodbg:#e7f3ec; --warnbg:#fdf3df; --badbg:#fbeaea; --nbg:#eceff3;
  --fs:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d26; --ink:#e8edf3; --soft:#9aa7b6; --line:#2a3542;
  --accent:#7aa6ef; --good:#6fd39e; --warn:#e8bf6a; --bad:#f0908e;
  --goodbg:#172c22; --warnbg:#2e2616; --badbg:#301c1c; --nbg:#1e2733; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d26; --ink:#e8edf3; --soft:#9aa7b6; --line:#2a3542;
  --accent:#7aa6ef; --good:#6fd39e; --warn:#e8bf6a; --bad:#f0908e;
  --goodbg:#172c22; --warnbg:#2e2616; --badbg:#301c1c; --nbg:#1e2733; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);margin:0;line-height:1.5;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.015em}
h3{font-size:14px;margin:0 0 9px;letter-spacing:.02em;text-transform:uppercase;font-family:var(--fm);color:var(--soft)}
p{margin:0 0 12px}
.topbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:17px}
.brand span{color:var(--accent)}
.roles{display:flex;flex-wrap:wrap;gap:5px;margin-left:auto}
.rb{font-family:var(--fm);font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--surface);color:var(--soft);border-radius:999px;padding:6px 12px;cursor:pointer}
.rb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rb[aria-pressed="true"]{color:#0e1319}}
:root[data-theme="dark"] .rb[aria-pressed="true"]{color:#0e1319}
.banner{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 13px;font-size:13px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:1fr 370px;gap:16px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px}
.card.tight{padding:13px}
label{display:block;font-size:11px;font-family:var(--fm);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
select,input[type=text],input[type=number]{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px;padding:0 11px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
button.b{font-family:inherit;font-size:14.5px;font-weight:600;border-radius:9px;cursor:pointer;min-height:44px;
  padding:0 15px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.b:hover{border-color:var(--soft)}
button.b.p{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.b.p{color:#0e1319}}
:root[data-theme="dark"] button.b.p{color:#0e1319}
button.b.g{background:var(--good);border-color:var(--good);color:#fff}
button.b.d{color:var(--bad);border-color:var(--line)}
button.b:disabled{opacity:.45;cursor:default}
button.sm{min-height:34px;font-size:13px;padding:0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prod{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.prod:first-child{border-top:0}
.prod .nm{flex:1 1 auto;min-width:0}
.prod .nm b{display:block;font-weight:600;font-size:14.5px}
.prod .nm s{display:block;text-decoration:none;color:var(--soft);font-size:12.5px}
.money{font-family:var(--fm);font-variant-numeric:tabular-nums}
.tag{font-family:var(--fm);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:4px;white-space:nowrap}
.t-g{background:var(--goodbg);color:var(--good)} .t-w{background:var(--warnbg);color:var(--warn)}
.t-b{background:var(--badbg);color:var(--bad)} .t-n{background:var(--nbg);color:var(--accent)}
.sum{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.sum b{font-family:var(--fm);font-variant-numeric:tabular-nums}
.hero{border-radius:10px;padding:13px;margin-bottom:11px}
.hero.ok{background:var(--goodbg)} .hero.no{background:var(--warnbg)}
.hero .big{font-size:26px;font-weight:700;letter-spacing:-.5px;font-family:var(--fm);font-variant-numeric:tabular-nums}
.hero .lab{font-family:var(--fm);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.hero .msg{font-size:13px;margin-top:5px;font-weight:600}
.hero.ok .msg{color:var(--good)} .hero.no .msg{color:var(--warn)}
.bitem{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;background:var(--surface)}
.bitem .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.bitem .hd .id{font-family:var(--fm);font-size:12.5px;color:var(--soft)}
.why{background:var(--warnbg);color:var(--warn);border-radius:7px;padding:8px 11px;font-size:13px;font-weight:600;margin:8px 0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--soft);font-size:14.5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--fm);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.hist{font-size:12.5px;color:var(--soft);padding:4px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.statusline{font-size:13px;color:var(--soft);margin-left:auto}
/* ---- configurator face, after the October prototype ---- */
.cfg-head{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:11px}
.cfg-logo{font-size:22px;font-weight:700;letter-spacing:-.5px}
.cfg-logo span{color:var(--accent)}
.cfg-loc{font-size:13.5px;color:var(--soft)}
.cfg-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);
  border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--soft)}
.cfg-chip.on{color:var(--good);border-color:var(--good)}
.cfg-vin{font-size:12.5px;color:var(--soft);flex:1 1 180px;min-width:0}
.cfg-modes{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.cfg-modes button{border:0;background:none;padding:7px 13px;font-family:inherit;font-size:13px;
  color:var(--soft);cursor:pointer;min-height:36px}
.cfg-modes button.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cfg-modes button.on{color:#0e1319}}
:root[data-theme="dark"] .cfg-modes button.on{color:#0e1319}

.cfg-steps{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:8px 10px;margin-bottom:12px}
.cfg-steps button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;
  background:none;padding:0 13px;min-height:42px;font-family:inherit;font-size:14px;color:var(--soft);cursor:pointer;white-space:nowrap}
.cfg-steps button .n{width:20px;height:20px;border-radius:50%;background:var(--nbg);color:var(--soft);
  font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cfg-steps button.on{background:var(--accent);color:#fff}
.cfg-steps button.on .n{background:rgba(255,255,255,.25);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cfg-steps button.on{color:#0e1319}
  :root:not([data-theme="light"]) .cfg-steps button.on .n{background:rgba(0,0,0,.2);color:#0e1319}}
:root[data-theme="dark"] .cfg-steps button.on{color:#0e1319}
:root[data-theme="dark"] .cfg-steps button.on .n{background:rgba(0,0,0,.2);color:#0e1319}
.cfg-steps button.held{opacity:.5}

.cfg-cols{display:grid;grid-template-columns:1fr 374px;gap:13px;align-items:start}
@media(max-width:980px){.cfg-cols{grid-template-columns:1fr}}
.cfg-stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.cfg-selects{display:flex;flex-wrap:wrap;gap:9px}
.cfg-selects .mini{flex:1 1 110px;min-width:0}
.mini label{font-size:9.5px;letter-spacing:.08em;margin-bottom:3px}
.mini .fixed,.mini .swatch{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 11px;
  border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:14.5px;font-weight:600}
.mini .swatch i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.mini select{min-height:38px;font-weight:600}

.cfg-truckwrap{display:flex;gap:11px;margin-top:12px;align-items:stretch}
.cfg-ht{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:8px 3px}
.cfg-ht .lab{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
.cfg-ht .arw{border:0;background:none;color:var(--accent);cursor:pointer;font-size:11px;line-height:1;padding:4px;min-height:26px}
.cfg-ht .track{position:relative;flex:1 1 auto;width:7px;min-height:96px;border-radius:4px;background:var(--nbg)}
.cfg-ht .fill{position:absolute;left:0;right:0;bottom:0;border-radius:4px;background:var(--accent)}
.cfg-ht .knob{position:absolute;left:50%;width:20px;height:20px;margin-left:-10px;margin-bottom:-10px;
  border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.cfg-ht .val{font-size:11px;font-weight:700;text-align:center;line-height:1.15}
.tcol{flex:1 1 auto;min-width:0}
.cfg-truck{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:16px;
  padding:18px 20px;overflow:hidden}
.cfg-truck img{display:block;width:100%;height:auto;transition:transform .18s}
.cfg-truck .pill{position:absolute;top:12px;display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
  font-size:13px;font-weight:600;color:var(--ink)}
.cfg-truck .pill.left{left:12px}.cfg-truck .pill.right{right:12px}
.cfg-stance{display:flex;align-items:center;gap:10px;margin-top:9px;padding:0 2px}
.cfg-stance .lab{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--soft)}
.cfg-stance button{border:0;background:none;color:var(--accent);font-size:18px;cursor:pointer;
  width:30px;min-height:32px;line-height:1}
.cfg-stance .strack{position:relative;flex:1 1 auto;height:8px;border-radius:4px;background:var(--nbg)}
.cfg-stance .sfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.cfg-stance .sknob{position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;margin-left:-10px;
  border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.cfg-stance .sval{font-size:14.5px;font-weight:700;min-width:46px;text-align:right}

.cfg-browse{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
.bhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:10px}
.bhead h3{margin:0;font-size:18px;font-family:var(--fs);text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.bhead .s{font-size:12.5px;color:var(--soft)}
.bhead .c{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--soft)}
.cardrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.pcard{position:relative;flex:0 0 170px;text-align:left;cursor:pointer;border:2px solid var(--line);
  border-radius:14px;padding:0 0 11px;background:var(--surface);overflow:hidden;font-family:inherit}
.pcard.on{border-color:var(--accent)}
.pcard:hover{border-color:var(--soft)}
.pthumb{display:block;width:100%;height:112px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pthumb img{width:100%;height:112px;object-fit:contain}
.pthumb .noimg{font-size:11px;color:#98a2ae}
.pcard .fit{position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%;
  background:var(--good);box-shadow:0 0 0 2px var(--surface)}
.pcard b{display:block;padding:9px 11px 0;font-size:14.5px;font-weight:700;line-height:1.25}
.pcard s{display:block;padding:1px 11px 0;font-size:11.5px;color:var(--soft);text-decoration:none;line-height:1.35}
.pcard em{display:block;padding:6px 11px 0;font-size:16px;font-weight:700;font-style:normal;color:var(--good)}
.pcard u{display:block;padding:2px 11px 0;font-size:11.5px;color:var(--soft);text-decoration:none}
.rownote{margin:9px 0 0;font-size:12.5px;color:var(--soft)}
.heldbox{border:1px dashed var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.heldbox b{display:block;font-size:15px;margin-bottom:4px}
.heldbox p{margin:0;font-size:13.5px;color:var(--soft)}

.cfg-rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-acc{background:var(--goodbg);border:1px solid var(--good);border-radius:16px;padding:13px 15px}
.rail-acc .lab,.rail-card .lab{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--soft)}
.rail-acc .trio{display:flex;margin-top:7px}
.fig{flex:1 1 0;min-width:0;padding:0 10px;border-left:1px solid var(--good)}
.fig:first-child{padding-left:0;border-left:0}
.fig .l{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--soft)}
.fig .v{display:block;font-size:18px;font-weight:700;line-height:1.2;font-family:var(--fm);font-variant-numeric:tabular-nums}
.fig.big .v{font-size:25px;color:var(--good)}
.rail-acc .note,.rail-card .note{margin:6px 0 0;font-size:12px;color:var(--soft);line-height:1.4}
.rail-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.airow{display:flex;gap:8px;margin-top:7px;align-items:center}
.inwrap{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:4px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);padding:0 10px}
.inwrap input{border:0;background:none;min-height:42px;font-size:17px;font-weight:700;padding:0;width:100%}
.inwrap .dol{font-weight:700;color:var(--soft)}.inwrap .per{font-size:12px;color:var(--soft)}
.findbtn{flex:0 0 auto;border:0;border-radius:10px;background:var(--accent);color:#fff;min-height:44px;
  padding:0 13px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .findbtn{color:#0e1319}}
:root[data-theme="dark"] .findbtn{color:#0e1319}
.lts{display:flex;gap:8px;margin-top:7px}
.lt{flex:1 1 0;min-width:0}
.lt .l{display:block;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--soft)}
.lt .v{display:block;font-size:15px;font-weight:700}
.ybh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ybh h4{margin:0;font-size:17px}
.ybh .cnt{font-size:13px;color:var(--soft)}
.bline{display:flex;align-items:center;gap:7px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.bth{flex:0 0 auto;width:40px;height:40px;border-radius:9px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center}
.bth img{width:40px;height:40px;object-fit:contain}
.bnm{flex:1 1 90px;min-width:0}
.bnm b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.bnm s{display:block;font-size:11.5px;color:var(--soft);text-decoration:none}
.bqty{flex:0 0 auto;display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.bqty button{border:0;background:none;width:24px;min-height:30px;cursor:pointer;color:var(--soft);font-size:14px}
.bqty .q{font-size:13.5px;font-weight:700;min-width:16px;text-align:center}
.bpr{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--good);font-family:var(--fm)}
.btag{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:var(--bg);
  padding:4px 10px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--soft)}
.btag.must{background:var(--warnbg);color:var(--warn);border-color:var(--warnbg)}
.btag.locked{background:var(--nbg);color:var(--accent)}
.bx{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:50%;
  width:26px;height:26px;cursor:pointer;color:var(--soft);font-size:14px;line-height:1}
.rail-hero{border-radius:16px;padding:13px 15px}
.rail-hero.ok{background:var(--goodbg)}.rail-hero.no{background:var(--warnbg)}
.rail-hero.idle{background:var(--surface);border:1px solid var(--line)}
.rail-hero.idle .lab{color:var(--soft)}
.rail-hero .lab{font-size:10px;font-weight:700;letter-spacing:.08em}
.rail-hero.ok .lab{color:var(--good)}.rail-hero.no .lab{color:var(--warn)}
.rail-hero .msg{font-size:14px;font-weight:600;margin-top:4px;line-height:1.4}
.rail-hero .sub{font-size:12.5px;color:var(--soft);margin-top:5px;font-family:var(--fm)}
.neg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.who{grid-column:1/-1}
.who label,.neg label{font-size:9.5px;letter-spacing:.07em;margin-bottom:3px}
.rail-acts{display:flex;flex-direction:column;gap:8px}
.rail-acts .b{width:100%}
.rail-acts .big{min-height:52px;font-size:16px}

/* ---- sales manager: summary first ---- */
.mgr-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.mgr-head .eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.mgr-head h2{font-size:27px;margin:3px 0 2px;letter-spacing:-.02em}
.mgr-head .sub{margin:0;color:var(--soft);font-size:15px}
.mgr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:22px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.mtile.warn{border-color:var(--warn);background:var(--warnbg)}
.mtile.ok{border-color:var(--line)}
.mtile .l{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.mtile .v{display:block;font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mtile .s{display:block;font-size:12.5px;color:var(--soft)}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:0 0 11px}
.sec-title.tight{margin-bottom:8px}
.sec-title h3{margin:0;font-family:var(--fs);font-size:17px;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.sec-title .hint{font-size:12.5px;color:var(--soft)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 17px;margin-bottom:12px}
.qtop{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.qwho{flex:1 1 220px;min-width:0}
.qwho b{display:block;font-size:18px;font-weight:700;letter-spacing:-.01em}
.qwho .meta{display:block;font-size:12.5px;color:var(--soft);margin-top:2px}
.qfig{text-align:right;flex:0 0 auto}
.qfig .big{display:block;font-size:21px;font-weight:700;font-family:var(--fm);font-variant-numeric:tabular-nums}
.qfig .sm{display:block;font-size:12.5px;color:var(--soft)}
.qwhy{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:13.5px;font-weight:600;margin:10px 0}
.qwhy.big{margin:0 0 16px;font-size:14.5px}
.qbul{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.qbul li{font-size:14px;position:relative;padding-left:14px;color:var(--ink)}
.qbul li:before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.qmoney{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.mchip{font-family:var(--fm);font-size:11.5px;font-weight:600;background:var(--nbg);color:var(--soft);
  padding:4px 9px;border-radius:5px;white-space:nowrap}
.mchip.g{background:var(--goodbg);color:var(--good)}
.mchip.w{background:var(--warnbg);color:var(--warn)}
.qacts{display:flex;flex-wrap:wrap;gap:7px}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--bg)}
.backlink{border:0;background:none;color:var(--accent);font-family:inherit;font-size:14px;cursor:pointer;
  padding:0 0 12px;min-height:30px}
.dhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.dhead h2{font-size:25px;margin:0;letter-spacing:-.02em}
.dhead .sub{margin:3px 0 0;color:var(--soft);font-size:13.5px}
.dfig{margin-left:auto;text-align:right}
.dfig .big{display:block;font-size:26px;font-weight:700;font-family:var(--fm);font-variant-numeric:tabular-nums}
.dfig .sm{display:block;font-size:12.5px;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.block h3{font-family:var(--fs);font-size:16px;text-transform:none;letter-spacing:-.01em;color:var(--ink);
  margin:0 0 11px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14.5px}
.kv .k{color:var(--soft);min-width:0}
.kv .v{font-weight:600;text-align:right;white-space:nowrap}
.kv .v.m{font-family:var(--fm);font-variant-numeric:tabular-nums}
.kv.strong{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.kv.strong .k,.kv.strong .v{font-weight:700;color:var(--ink)}
.dsums{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.mnote{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
  color:var(--ink);font-family:inherit;font-size:14.5px;padding:10px;margin-bottom:11px;resize:vertical}
.dealbox{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-top:4px}
.dealbox>summary{cursor:pointer;padding:9px 12px;font-size:13.5px;font-weight:600;list-style:none}
.dealbox>summary::-webkit-details-marker{display:none}
.dealbox>summary::before{content:"\25B8";margin-right:7px;color:var(--soft)}
.dealbox[open]>summary::before{content:"\25BE"}
.dealgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px 10px}
.dealbox .note{padding:0 12px 10px;margin:0}

</style>

<script>
(function(){
  var VEH=[{k:"f150",n:"2026 Ford F-150 XLT",msrp:58990,trim:"XLT SuperCrew",color:"Ruby Red Metallic",hex:"#c5221f"},
           {k:"raptor",n:"2026 Ford F-150 Raptor",msrp:81500,trim:"Raptor SuperCrew",color:"Code Orange",hex:"#e4601f"},
           {k:"f250",n:"2026 Ford F-250 Super Duty",msrp:67400,trim:"Lariat Crew",color:"Agate Black",hex:"#23262b"},
           {k:"bronco",n:"2026 Ford Bronco Badlands",msrp:48900,trim:"Badlands 4dr",color:"Azure Gray",hex:"#6e7b86"}];
  var VN={}; VEH.forEach(function(v){VN[v.k]=v;});
  var ROLES=[{k:"sales",n:"Salesperson"},{k:"mgr",n:"Sales Manager"},
             {k:"parts",n:"Parts"},{k:"admin",n:"Super Admin"},{k:"cfg",n:"Settings"}];
  var LINE_STATES=["Awaiting sourcing","Ready to order","Ordered","In transit","Received"];
  var MARKUP=1.42, LABOR_RATE=140, LABOR_COST=42;
  var BYSKU={}; PRODUCTS.forEach(function(p){ BYSKU[p.sku]=p; });
  function pick(cat,i){ var a=PRODUCTS.filter(function(p){return p.cat===cat;}); return (a[i]||a[0]||{}).sku; }
  var PACKS=[
    {name:"Gator Off-Road", lift:2, items:[pick("Wheels",0),pick("Tires",3),pick("Fender flares",0)]},
    {name:"Sport Performance", lift:1, items:[pick("Wheels",10),pick("Tires",4)]},
    {name:"Tactical Edition", lift:3, items:[pick("Wheels",14),pick("Tires",2),pick("Fender flares",1)]},
    {name:"City Cruiser", lift:0, items:[pick("Wheels",16),pick("Tires",9)]}
  ];

  var role="sales", db=null, builds=[], cfg=null, busy=false, refreshSubmit=null;
  var draft={veh:"f150",cust:"",rep:"",lines:{},hours:6,disc:0,
             lift:2,stance:2,mode:"mo",step:"popular",target:95,
             deal:{down:4700,trade:0,payoff:0,rebates:0,docfee:799,term:72,rate:6.9},
             id:"B-2026-"+String(Math.floor(Math.random()*9000)+1000),
             stock:"F26-"+String(Math.floor(Math.random()*9000)+1000)};

  var viewEl=document.getElementById("view"), statusEl=document.getElementById("status"),
      rolesEl=document.getElementById("roles"), whoEl=document.getElementById("whoami");

  function money(n){ var x=Math.round(n); return (x<0?"\u2212$":"$")+Math.abs(x).toLocaleString(); }
  function pct(n){ return (n*100).toFixed(1)+"%"; }
  function esc(s){ return String(s==null?"":s); }
  function say(t){ statusEl.textContent=t||""; }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

  ROLES.forEach(function(r){
    var b=el("button","rb",r.n); b.type="button";
    b.setAttribute("aria-pressed",String(r.k===role));
    b.addEventListener("click",function(){
      role=r.k;
      Array.prototype.forEach.call(rolesEl.children,function(c,i){ if(ROLES[i]) c.setAttribute("aria-pressed",String(ROLES[i].k===role)); });
      try{localStorage.setItem("bp_role",role);}catch(e){}
      draw();
    });
    rolesEl.appendChild(b);
  });
  try{ var sr=localStorage.getItem("bp_role");
    if(sr&&ROLES.some(function(r){return r.k===sr;})){ role=sr;
      Array.prototype.forEach.call(rolesEl.children,function(c,i){ if(ROLES[i]) c.setAttribute("aria-pressed",String(ROLES[i].k===role)); }); }
  }catch(e){}

  // ---------- money maths ----------
  function sellOf(p){ return Math.round(p.cost*MARKUP); }
  function totals(b){
    var partsSell=0, partsCost=0;
    (b.lines||[]).forEach(function(l){ partsSell+=l.sell*l.qty; partsCost+=l.cost*l.qty; });
    var hrs=b.hours||0;
    var laborSell=hrs*LABOR_RATE, laborCost=hrs*LABOR_COST;
    var disc=Math.min(Math.max(0,b.disc||0), partsSell+laborSell);
    var rev=partsSell+laborSell-disc;
    var cost=partsCost+laborCost;
    var gross=rev-cost;
    return {partsSell:partsSell,partsCost:partsCost,laborSell:laborSell,laborCost:laborCost,
            disc:disc,rev:rev,cost:cost,gross:gross,marginPct:rev>0?gross/rev:0};
  }
  function repRule(name){
    var reps=(cfg&&cfg.reps)||[];
    for(var i=0;i<reps.length;i++) if(reps[i].name===name) return reps[i];
    return reps[0]||{name:name,mode:"pct",value:28};
  }
  function check(b){
    var t=totals(b), r=repRule(b.rep);
    if(!r) return {ok:true,t:t,why:""};
    if(r.mode==="pct"){
      var floor=r.value/100;
      if(t.marginPct>=floor) return {ok:true,t:t,rule:r,why:""};
      return {ok:false,t:t,rule:r,
        why:b.rep+" may go to "+r.value+"% margin. This build is at "+pct(t.marginPct)+
            " — "+((floor-t.marginPct)*100).toFixed(1)+" points under."};
    }
    if(t.gross>=r.value) return {ok:true,t:t,rule:r,why:""};
    return {ok:false,t:t,rule:r,
      why:b.rep+" may go down to "+money(r.value)+" gross. This build holds "+money(t.gross)+
          " — "+money(r.value-t.gross)+" short."};
  }

  // ---------- storage (this browser only) ----------
  var KEY="bphd_demo_v2";
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify({builds:builds,cfg:cfg})); }catch(e){} }
  function load(){
    try{ var raw=localStorage.getItem(KEY);
      if(raw){ var d=JSON.parse(raw);
        if(d&&d.builds) builds=d.builds;
        if(d&&d.cfg&&d.cfg.reps&&d.cfg.reps.length) cfg=d.cfg; }
    }catch(e){}
  }
  function nid(){ return "B-2026-"+String(Math.floor(Math.random()*9000)+1000); }
  async function save(b,msg){
    var i=-1;
    for(var k=0;k<builds.length;k++) if(builds[k].id===b.id){ i=k; break; }
    if(i>=0) builds[i]=b; else builds.unshift(b);
    builds.sort(function(x,y){ return (y.created||0)-(x.created||0); });
    persist(); say(msg||"Saved."); draw(); return true;
  }
  async function saveCfg(){ persist(); say("Settings saved."); }
  function stamp(b,who,what){ b.history=(b.history||[]).concat([{who:who,what:what,ts:Date.now()}]); }

  // ---------- salesperson ----------
  function drawSales(){
    var v=viewEl; v.innerHTML="";
    var reps=(cfg&&cfg.reps)||[];
    if(!draft.rep && reps.length) draft.rep=reps[0].name;

    var cols=el("div","cols");
    var left=el("div"), right=el("div");

    // vehicle + customer
    var c1=el("div","card");
    c1.appendChild(el("h3",null,"The deal"));
    var g=el("div","grid3");
    g.appendChild(field("Vehicle", selectEl(VEH.map(function(x){return {v:x.k,t:x.n};}), draft.veh, function(val){
      draft.veh=val; draft.lines={}; drawSales();
    })));
    g.appendChild(field("Customer", inputEl("text", draft.cust, "Name", function(val){
      draft.cust=val; if(refreshSubmit) refreshSubmit();
    })));
    g.appendChild(field("Salesperson", selectEl(reps.map(function(r){return {v:r.name,t:r.name};}), draft.rep, function(val){
      draft.rep=val; drawSales();
    })));
    c1.appendChild(g);
    left.appendChild(c1);

    // catalogue
    ["Wheels","Tires","Light Bars","Winches","Fender flares","Step Rails","Tint","Wraps","Paint Protection"].forEach(function(cat){
      var items=PRODUCTS.filter(function(p){ return p.cat===cat && p.fits.indexOf(draft.veh)>=0; });
      if(!items.length) return;
      var c=el("div","card");
      c.appendChild(el("h3",null,cat+" · "+items.length+" fit this truck"));
      items.forEach(function(p){
        var r=el("div","prod");
        var on=!!draft.lines[p.sku];
        var nm=el("div","nm");
        var b=el("b",null,p.name); nm.appendChild(b);
        var bits=[p.size,p.off,p.finish].filter(Boolean).join(" · ");
        nm.appendChild(el("s",null,bits||"Vehicle specific"));
        r.appendChild(nm);
        if(p.est){ var t=el("span","tag t-w","Est"); r.appendChild(t); }
        var price=el("span","money"); price.style.minWidth="76px"; price.style.textAlign="right";
        price.textContent=money(sellOf(p)*p.qty);
        r.appendChild(price);
        var btn=el("button","b sm"+(on?" g":""),on?"Added":"Add"); btn.type="button";
        btn.addEventListener("click",function(){
          if(draft.lines[p.sku]) delete draft.lines[p.sku];
          else draft.lines[p.sku]={sku:p.sku,cat:p.cat,name:p.name,size:p.size,finish:p.finish,
                                   qty:p.qty,cost:p.cost,sell:sellOf(p),est:p.est};
          drawSales();
        });
        r.appendChild(btn);
        c.appendChild(r);
      });
      left.appendChild(c);
    });

    // right: live money
    var lines=Object.keys(draft.lines).map(function(k){return draft.lines[k];});
    var b={veh:draft.veh,lines:lines,hours:draft.hours,disc:draft.disc,rep:draft.rep};
    var res=check(b), t=res.t;

    var h=el("div","card tight");
    var hero=el("div","hero "+(res.ok?"ok":"no"));
    hero.appendChild(el("div","lab","Customer pays"));
    hero.appendChild(el("div","big",money(t.rev)));
    hero.appendChild(el("div","msg",res.ok?"Within "+esc(draft.rep)+"'s authority — can be closed at the desk":"Needs the sales manager"));
    h.appendChild(hero);
    if(!res.ok){ var w=el("div","why",res.why); h.appendChild(w); }
    h.appendChild(sumRow("Parts",t.partsSell));
    h.appendChild(sumRow("Labor · "+draft.hours+" hrs at "+money(LABOR_RATE),t.laborSell));

function addLine(p){
  if(!p) return;
  draft.lines[p.sku]={sku:p.sku,cat:p.cat,name:p.name,size:p.size,finish:p.finish,
                      qty:p.qty,cost:p.cost,sell:sellOf(p),est:p.est,tag:"nice"};
}
function perMonth(principal){
  var r=0.069/12, n=72;
  if(principal<=0) return "$0";
  var pay=principal*r/(1-Math.pow(1+r,-n));
  return "$"+Math.round(pay).toLocaleString();
}
function optimiseToTarget(){
  var order={locked:0,must:1,nice:2};
  var guard=0;
  while(guard++<40){
    var lines=Object.keys(draft.lines).map(function(k){return draft.lines[k];});
    if(!lines.length) break;
    var t=totals({veh:draft.veh,lines:lines,hours:draft.hours,disc:draft.disc});
    var pm=principalToMonthly(t.rev);
    if(pm<=draft.target) break;
    var drop=lines.slice().sort(function(a,b){
      var d=(order[b.tag]||2)-(order[a.tag]||2);
      if(d) return d;
      return (b.sell*b.qty)-(a.sell*a.qty);
    })[0];
    if(!drop || drop.tag==="locked") break;
    delete draft.lines[drop.sku];
  }
  drawSalesRich();
  say("Optimised toward $"+draft.target+"/mo. Locked lines were never touched.");
}
function principalToMonthly(p){
  var r=0.069/12,n=72;
  if(p<=0) return 0;
  return p*r/(1-Math.pow(1+r,-n));
}

function dealOf(b){
  var d=b.deal||{};
  return {down:+d.down||0, trade:+d.trade||0, payoff:+d.payoff||0,
          rebates:+d.rebates||0, docfee:d.docfee==null?799:+d.docfee,
          term:d.term||72, rate:d.rate==null?6.9:+d.rate};
}
function dealMath(b){
  var t=totals(b), d=dealOf(b), veh=VN[b.veh]||VEH[0];
  var price=veh.msrp + t.rev;                     // truck + accessories
  var equity=d.trade - d.payoff;
  var financed=Math.max(0, price + d.docfee - d.down - equity - d.rebates);
  var r=(d.rate/100)/12, n=d.term;
  var pay = financed<=0 ? 0 : financed*r/(1-Math.pow(1+r,-n));
  return {t:t,d:d,veh:veh,price:price,equity:equity,financed:financed,pay:pay};
}
function summarise(b){
  var out=[], byCat={};
  (b.lines||[]).forEach(function(l){ (byCat[l.cat]=byCat[l.cat]||[]).push(l); });
  Object.keys(byCat).forEach(function(c){
    var ls=byCat[c];
    out.push(ls.length===1
      ? (ls[0].qty>1? ls[0].qty+"× "+ls[0].name : ls[0].name)
      : ls.length+" "+c.toLowerCase());
  });
  if(b.hours) out.push(b.hours+" hrs fitting");
  if(b.disc) out.push(money(b.disc)+" discount given");
  return out;
}

    var ap=el("button","b g","Approve the build"); ap.type="button";
    ap.addEventListener("click",async function(){
      b.status="approved"; b.approvedBy="Sales manager"; b.why="";
      stamp(b,"Sales manager","Approved"+(note.value.trim()?" — "+note.value.trim():""));
      mgrOpen=null; await save(b,"Approved.");
    });
    var ct=el("button","b","Counter — cut the discount by $250"); ct.type="button";
    ct.addEventListener("click",async function(){
      b.disc=Math.max(0,(b.disc||0)-250);
      var ch=check(b);
      b.status=ch.ok?"approved":"pending"; b.why=ch.ok?"":ch.why;
      if(ch.ok) b.approvedBy="Sales manager, countered";
      stamp(b,"Sales manager","Countered: discount cut by $250"+(ch.ok?" and approved":"")+(note.value.trim()?" — "+note.value.trim():""));
      await save(b, ch.ok?"Countered and approved.":"Countered, still under the floor.");
      drawMgr();
    });
    var rj=el("button","b d","Reject"); rj.type="button";
    rj.addEventListener("click",async function(){
      b.status="rejected";
      stamp(b,"Sales manager","Rejected"+(note.value.trim()?" — "+note.value.trim():""));
      mgrOpen=null; await save(b,"Rejected.");
    });
    row.appendChild(ap); row.appendChild(ct); row.appendChild(rj);
    act.appendChild(row);
    v.appendChild(act);
  }

  if((b.history||[]).length){
    var hc=el("div","card");
    hc.appendChild(el("h3",null,"History"));
    b.history.forEach(function(x){
      hc.appendChild(el("div","hist", x.who+" · "+x.what+" · "+
        new Date(x.ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})));
    });
    v.appendChild(hc);
  }
}

function kv(k,val,mono,strong){
  var d=el("div","kv"+(strong?" strong":""));
  d.appendChild(el("span","k",k));
  var s=el("span","v"+(mono?" m":"")); s.textContent=val;
  d.appendChild(s); return d;
}

})();
</script>
